<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Model Auto-Downloader</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #1e1e2e; color: #cdd6f4;
    margin: 0; padding: 0 0 4rem; font-size: 14px; line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #181825; border-bottom: 1px solid #313244;
    padding: 1rem 1.5rem;
  }
  .marke-zeile { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .55rem; }
  .marke-zeile .logo {
    font-weight: 900; font-size: 13px; color: #22c55e;
    text-shadow: 1px 1px 0 #0d4e26;
  }
  .marke-zeile .marke { font-size: 12px; font-weight: 600; color: #a6adc8; }
  .kopf { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
  h1 { font-size: 1.15rem; margin: 0; color: #cba6f7; }
  .zaehler { font-size: 12px; color: #a6adc8; }
  .werkzeuge { display: flex; gap: .6rem; margin-top: .85rem; flex-wrap: wrap; }
  input[type="search"], select {
    font: inherit; font-size: 13px;
    background: #1e1e2e; color: #cdd6f4;
    border: 1px solid #45475a; border-radius: 6px; padding: 7px 10px;
  }
  input[type="search"] { flex: 1 1 15rem; min-width: 12rem; }
  .werkzeuge button { font-size: 13px; padding: 7px 12px; border-radius: 6px; }
  .werkzeuge button[aria-pressed="true"] { background: #2a2140; color: #cba6f7; }
  input:focus, select:focus { outline: 2px solid #cba6f7; outline-offset: -1px; }

  main { padding: 1.5rem; }
  .raster {
    display: grid; gap: 1rem;
    grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr));
  }
  .karte {
    background: #181825; border: 1px solid #313244; border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s;
    display: flex; flex-direction: column;
  }
  .karte:hover { border-color: #cba6f7; transform: translateY(-2px); }
  .bild {
    aspect-ratio: 4 / 3; background: #11111b;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .bild img { width: 100%; height: 100%; object-fit: cover; }
  .bild .leer { font-size: 26px; font-weight: 900; color: #313244; }
  .text { padding: .7rem .8rem .85rem; }
  .name {
    font-size: 13px; font-weight: 600; margin-bottom: .4rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .meta { display: flex; align-items: center; gap: .45rem; font-size: 11px; color: #a6adc8; }
  .quelle {
    padding: 1px 7px; border-radius: 10px; font-weight: 600; font-size: 10px;
    background: #313244; color: #cdd6f4;
  }
  .quelle.Thingiverse { background: #1a3a4a; color: #89dceb; }
  .quelle.Printables  { background: #4a2a1a; color: #fab387; }
  .quelle.MakerWorld  { background: #1a3a2a; color: #a6e3a1; }

  .korbnote {
    font-size: 12px; color: #a6adc8; margin: 0 0 1.1rem;
    border-left: 2px solid #45475a; padding-left: .7rem;
  }
  .hinweis { color: #a6adc8; padding: 2rem 0; text-align: center; }
  .hinweis a { color: #cba6f7; }
  .hinweis p { margin: 0 0 1.1rem; }

  .frage { max-width: 24rem; padding: 1.2rem 1.3rem 1.1rem; }
  .frage h2 { margin: 0 0 .5rem; font-size: 1rem; }
  .frage p { margin: 0; color: #a6adc8; }
  .f-fuss { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.3rem; }

  dialog {
    background: #181825; color: #cdd6f4; border: 1px solid #313244;
    border-radius: 12px; padding: 0; max-width: 34rem; width: calc(100% - 2rem);
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }

  button {
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 7px 13px; border: none; border-radius: 6px; cursor: pointer;
    background: #45475a; color: #cdd6f4;
  }
  button:hover { opacity: .85; }
  button.gefahr { background: #4a1f1f; color: #f38ba8; }
  button.wichtig { background: #1a3a2a; color: #a6e3a1; padding: 9px 16px; }
</style>
</head>
<body>

<header>
  <div class="marke-zeile">
    <span class="logo">3D</span>
    <span class="marke" data-i18n="appName">3D Model Auto-Downloader</span>
  </div>
  <div class="kopf">
    <h1 id="libTitel" data-i18n="libHeading">Meine Modelle</h1>
    <span class="zaehler" id="zaehler"></span>
  </div>
  <div class="werkzeuge">
    <input type="search" id="suche" data-i18n-ph="libSearch" placeholder="Nach Namen suchen …">
    <select id="quelle"><option value="" data-i18n="libAllPlatforms">Alle Plattformen</option></select>
    <select id="sortierung">
      <option value="datum-ab" data-i18n="libSortNewest">Neueste zuerst</option>
      <option value="datum-auf" data-i18n="libSortOldest">Älteste zuerst</option>
      <option value="name-auf" data-i18n="libSortName">Name A–Z</option>
    </select>
    <button id="papierkorb" aria-pressed="false" data-i18n="libTrashButton">Papierkorb</button>
    <button id="korbLeeren" class="gefahr" hidden data-i18n="libTrashEmptyButton">Papierkorb leeren</button>
  </div>
</header>

<main>
  <p class="korbnote" id="korbNote" hidden data-i18n="libTrashNote">Gelöschte Modelle liegen im Ordner _Trash_ in deinem Zielordner, bis du den Papierkorb leerst.</p>
  <div class="hinweis" id="hinweis" data-i18n="libLoading">Ordner wird gelesen …</div>
  <div class="raster" id="raster"></div>
</main>


<!-- Eigene Rueckfrage statt confirm(): Chromes Fenster sagt "The extension
     ... says", sieht aus wie eine Systemwarnung und passt zu nichts hier. -->
<dialog id="frage" class="frage">
  <h2 id="frageTitel"></h2>
  <p id="frageText"></p>
  <div class="f-fuss">
    <button id="frageNein" data-i18n="libCancel">Abbrechen</button>
    <button id="frageJa" class="gefahr"></button>
  </div>
</dialog>

<script src="target_dir.js"></script>
<script src="explorer_link.js"></script>
<script src="library.js"></script>
</body>
</html>
