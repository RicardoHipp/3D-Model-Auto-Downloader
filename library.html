<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Model Downloader &amp; Organizer</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #1e1e2e; color: #cdd6f4;
    margin: 0; padding: 0 0 4rem; font-size: 14px; line-height: 1.5;
  }
  /* Durchscheinend: Beim Scrollen schimmern die Kacheln verschwommen durch. */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(24, 24, 37, .72);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, .07);
    padding: 1rem 1.5rem;
  }
  /* Abgleich im Hintergrund: klein und blass, rechts in der Titelzeile. */
  .sync {
    margin-left: auto; font-size: 11px; color: #6c7086;
    display: inline-flex; align-items: center; gap: .35rem;
  }
  .sync[hidden] { display: none; }
  .sync::before {
    content: ''; width: 9px; height: 9px; border-radius: 50%;
    border: 1.5px solid #6c7086; border-top-color: transparent;
    animation: dreh 1s linear infinite;
  }
  @keyframes dreh { to { transform: rotate(360deg); } }
  /* Eine Zeile: das "3D" als Home-Knopf (home.js), daneben der Seitentitel. */
  .kopf { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  h1 { font-size: 1.15rem; margin: 0; color: #0a84ff; }
  .zaehler { font-size: 12px; color: #a6adc8; }
  .werkzeuge { display: flex; gap: .6rem; margin-top: .85rem; flex-wrap: wrap; }
  input[type="search"], select {
    font: inherit; font-size: 13px;
    background: rgba(255, 255, 255, .06); color: #cdd6f4;
    border: 1px solid rgba(255, 255, 255, .1); border-radius: 10px; padding: 7px 10px;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  select option { background: #1e1e2e; }
  /* Suche als Pille mit Lupe links und eigenem x zum Leeren. */
  .suchfeld { position: relative; flex: 1 1 15rem; min-width: 12rem; display: flex; }
  .suchfeld svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #8e8e93; pointer-events: none; }
  .suchfeld input[type="search"] { flex: 1; min-width: 0; border-radius: 999px; padding: 7px 32px 7px 32px; }
  .suchfeld input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .werkzeuge .suchLeeren {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; padding: 0; border-radius: 50%; line-height: 18px;
    font-size: 12px; background: rgba(255, 255, 255, .22); color: #1e1e2e; font-weight: 700;
  }
  .werkzeuge .suchLeeren[hidden] { display: none; }
  .werkzeuge .suchLeeren:hover { background: rgba(255, 255, 255, .4); opacity: 1; }
  /* Werkzeugleiste: alles als Pille und gleich hoch - Suche, Plattform,
     Sortierung, Papierkorb. Ueber die IDs, damit modern.css (Knoepfe 10 px)
     hier nicht dazwischenfunkt. */
  .werkzeuge select, .suchfeld input[type="search"], .segment, #papierkorb, #korbLeeren {
    box-sizing: border-box; height: 34px; border-radius: 999px;
  }
  .werkzeuge select { padding: 0 30px 0 14px; }
  #papierkorb, #korbLeeren { padding: 0 16px; }
  /* 6: Sortierung als Segment-Schalter mit gleitendem Hintergrund. */
  #sortierung { display: none; }
  .segment {
    position: relative; display: inline-flex; align-items: stretch; padding: 2px; border-radius: 999px;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .08);
  }
  .segment .schieber {
    position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: 999px;
    background: rgba(255, 255, 255, .14); box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
    transition: left .3s cubic-bezier(.34, 1.3, .64, 1), width .3s cubic-bezier(.34, 1.3, .64, 1);
  }
  .werkzeuge .segment button.wahl {
    position: relative; z-index: 1; background: none; border: none; box-shadow: none;
    font: inherit; font-size: 13px; padding: 0 14px; border-radius: 999px; color: #a6adc8; cursor: pointer;
    transition: color .2s ease;
  }
  .werkzeuge .segment button.wahl[aria-pressed="true"] { color: #f5f5f7; }
  .werkzeuge .segment button.wahl:hover { opacity: 1; color: #f5f5f7; }
  .werkzeuge button { font-size: 13px; padding: 7px 12px; border-radius: 6px; }
  .werkzeuge button[aria-pressed="true"] { background: #2a2140; color: #0a84ff; }
  input:focus, select:focus { outline: none; border-color: #0a84ff; box-shadow: 0 0 0 3px rgba(10, 132, 255, .35); }

  main { padding: 1.5rem; }
  .raster {
    display: grid; gap: 1rem;
    grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr));
  }
  .karte {
    background: #181825; border: 1px solid rgba(255, 255, 255, .07); border-radius: 14px;
    overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s;
    display: flex; flex-direction: column;
  }
  /* Beim Darueberfahren: weich anheben, Schatten und ein leichtes Leuchten,
     das Bild zoomt langsam heran. */
  .karte {
    transition: transform .35s cubic-bezier(.34, 1.3, .64, 1), box-shadow .35s ease, border-color .35s ease;
  }
  /* Ruhig wie bei Apple: etwas groesser, tiefer weicher Schatten, kein Leuchten. */
  .karte:hover {
    border-color: rgba(255, 255, 255, .12); transform: scale(1.02);
    box-shadow: 0 20px 40px -14px rgba(0, 0, 0, .75), 0 6px 12px -6px rgba(0, 0, 0, .4);
  }
  .bild img { transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
  .karte:hover .bild img { transform: scale(1.04); }
  /* Unten leicht abdunkeln, damit das # gut zu sehen ist. */
  .bild::after {
    content: ''; position: absolute; inset: auto 0 0 0; height: 45%; pointer-events: none;
    background: linear-gradient(transparent, rgba(17, 17, 27, .7));
    opacity: 0; transition: opacity .25s ease;
  }
  .karte:hover .bild::after { opacity: 1; }
  /* Beim Oeffnen zoomen alle Kacheln gemeinsam kurz auf (einzoomen aus
     modern.css). Nur der Anfangszustand - danach gehoert transform wieder
     dem Anheben. */
  .karte.rein { animation: einzoomen .5s cubic-bezier(.34, 1.3, .64, 1) backwards; }
  .bild {
    aspect-ratio: 4 / 3; background: #11111b;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .bild img { width: 100%; height: 100%; object-fit: cover; }
  .bild .leer { font-size: 26px; font-weight: 900; color: #313244; }
  .text { padding: .7rem .8rem .85rem; }
  .name {
    font-size: 13px; font-weight: 600; margin-bottom: .3rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  /* Plattform links oben, Datum rechts oben - als Pillen auf dem Bild, damit
     unten Platz fuer Titel und Tags bleibt. */
  .bild .quelle, .bild .datum {
    position: absolute; top: 6px; z-index: 1;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    /* Glas: halbdurchsichtig, das Bild dahinter verschwommen. */
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, .12);
  }
  .bild .quelle             { background: rgba(49, 50, 68, .6); }
  .bild .quelle.Thingiverse { background: rgba(26, 58, 74, .62); }
  .bild .quelle.Printables  { background: rgba(74, 42, 26, .62); }
  .bild .quelle.MakerWorld  { background: rgba(26, 58, 42, .62); }
  .bild .quelle.Cults       { background: rgba(46, 31, 74, .62); }
  .bild .quelle { left: 6px; }
  .bild .datum {
    right: 6px; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 600;
    background: rgba(17, 17, 27, .55); color: #cdd6f4;
  }
  .bild .datum:empty { display: none; }
  .quelle {
    padding: 1px 7px; border-radius: 10px; font-weight: 600; font-size: 10px;
    background: #313244; color: #cdd6f4;
  }
  .quelle.Thingiverse { background: #1a3a4a; color: #89dceb; }
  .quelle.Printables  { background: #4a2a1a; color: #fab387; }
  .quelle.MakerWorld  { background: #1a3a2a; color: #a6e3a1; }
  .quelle.Cults       { background: #2e1f4a; color: #cba6f7; }

  /* --- Tags --- */
  .tag {
    display: inline-flex; align-items: center; gap: .3rem;
    font-size: 11px; line-height: 1.4; padding: 1px 8px; border-radius: 999px;
    background: rgba(255, 255, 255, .08); color: #d1d1d6; border: 1px solid rgba(255, 255, 255, .1);
  }
  .karte .tags { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .1rem; }
  .karte .tags:empty { display: none; }
  .karte .tags .tag { font-size: 10px; padding: 0 6px; }
  .bild { position: relative; }
  .tagKnopf {
    position: absolute; bottom: 6px; right: 6px; z-index: 1; width: 26px; height: 26px; padding: 0;
    border-radius: 6px; font-weight: 700; font-size: 13px;
    background: rgba(17,17,27,.8); color: #64b5ff; opacity: 0; transition: opacity .15s;
  }
  .tagKnopf {
    transform: translateY(6px); transition: opacity .25s ease, transform .25s cubic-bezier(.2, .8, .2, 1);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .karte:hover .tagKnopf, .tagKnopf:focus-visible { opacity: 1; transform: none; }
  /* Rahmen fuer markiert und Ablage als eigene Ebene ueber der Kachel - ein
     innerer Schatten laege unter dem Bild und waere dort nicht zu sehen. */
  .karte { position: relative; }
  .karte.markiert::after, .karte.ablage::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: 0 0 0 2px #0a84ff inset; pointer-events: none; z-index: 2;
  }
  .karte.markiert { border-color: #0a84ff; }

  .tagLeiste { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .7rem; }
  .tagLeiste[hidden] { display: none; }
  .tagLeiste { align-items: center; }
  .leisteTitel { font-size: 12px; color: #a6adc8; margin-right: .2rem; }
  .tagLeiste .tag {
    cursor: pointer; font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 999px;
    transition: background .2s ease, box-shadow .2s ease, border-color .2s ease, color .2s ease;
  }
  .tagLeiste .tag .zahl { color: #6c7086; font-size: 11px; }
  .tagLeiste .tag[aria-pressed="true"] { background: #0a84ff; color: #fff; border-color: #0a84ff; }
  .tagLeiste .tag[aria-pressed="true"] .zahl { color: rgba(255, 255, 255, .7); }
  .tagLeiste .tag:hover { opacity: 1; border-color: rgba(255, 255, 255, .2); background-color: rgba(255, 255, 255, .13); box-shadow: none; }
  .tagLeiste .tag[aria-pressed="true"]:hover { background-color: #2a95ff; box-shadow: none; }
  .tagLeiste .tag[draggable="true"] { cursor: grab; }
  /* Neu angelegt, noch an keinem Modell. */
  .tagLeiste .tag.neu { border-style: dashed; }
  /* Filter aufheben: nur da, wenn nach Tags gefiltert wird. */
  .tagAlle {
    font: inherit; font-size: 12px; padding: 2px 11px; border-radius: 999px; cursor: pointer;
    background: rgba(10, 132, 255, .15); color: #64b5ff; border: 1px solid rgba(10, 132, 255, .35);
  }
  .tagAlle:hover { opacity: 1; background: rgba(10, 132, 255, .25); }
  .tagNeu, .tagHilfe {
    font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 10px;
    background: none; color: #a6adc8; border: 1px dashed rgba(255, 255, 255, .12);
  }
  .tagNeu:hover, .tagHilfe:hover { opacity: 1; color: #64b5ff; border-color: #64b5ff; }
  .tagHilfe { width: 24px; height: 24px; padding: 0; border-radius: 50%; border-style: solid; font-weight: 700; }
  .tagNeuFeld {
    font: inherit; font-size: 12px; width: 10rem; padding: 2px 10px; border-radius: 10px;
    background: #1e1e2e; color: #cdd6f4; border: 1px solid #0a84ff;
  }
  .tagNeuFeld:focus { outline: none; }
  .hilfe { max-width: 36rem; padding: 1.2rem 1.4rem 1.1rem; }
  .hilfe h2 { margin: 0 0 .8rem; font-size: 1.05rem; }
  .hilfe h3 { margin: 1rem 0 .3rem; font-size: 13px; color: #64b5ff; }
  .hilfe p, .hilfe li { margin: 0 0 .35rem; color: #bac2de; font-size: 13px; }
  .hilfe ul { margin: 0; padding-left: 1.2rem; }
  .hilfe .inhalt { max-height: 70vh; overflow: auto; padding-right: .3rem; }
  .tagLeiste .tag:active { cursor: grabbing; }
  /* Kachel, auf die gerade ein Tag gezogen wird. */
  .karte.ablage { border-color: #64b5ff; transform: translateY(-2px); }
  .karte.ablage::after { box-shadow: 0 0 0 2px #64b5ff inset; }

  .markiertBalken {
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    margin-top: .7rem; font-size: 12px; color: #0a84ff;
  }
  .markiertBalken[hidden] { display: none; }
  .markiertBalken button { font-size: 12px; padding: 4px 10px; }

  .tagEingabe {
    display: flex; flex-wrap: wrap; gap: .35rem; align-items: center;
    border: 1px solid rgba(255, 255, 255, .12); border-radius: 8px; padding: .4rem; background: #1e1e2e;
  }
  .tagEingabe .tag { font-size: 12px; padding: 2px 4px 2px 9px; }
  .tagEingabe .tag.teilweise { opacity: .55; border-style: dashed; }
  .tagWeg {
    background: none; padding: 0 4px; font-size: 14px; line-height: 1; color: inherit;
    border-radius: 50%;
  }
  .tagWeg:hover { background: #45475a; opacity: 1; }
  .tagFeld {
    flex: 1 1 8rem; min-width: 8rem; font: inherit; font-size: 13px;
    background: none; border: none; color: #cdd6f4; padding: 3px 4px;
  }
  .tagFeld:focus { outline: none; }
  .tagEingabe:focus-within { border-color: #0a84ff; }
  /* Vorhandene Tags zum Anklicken unter dem Feld. */
  .tagVorschlaege { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .7rem; max-height: 12rem; overflow: auto; }
  .tagVorschlaege[hidden] { display: none; }
  .tag.vorschlag {
    font: inherit; font-size: 12px; padding: 2px 9px; cursor: pointer;
    background: none; color: #a6adc8; border: 1px dashed rgba(255, 255, 255, .12);
  }
  .tag.vorschlag:hover { opacity: 1; color: #64b5ff; border-color: #64b5ff; border-style: solid; }
  .tagDialog { max-width: 30rem; padding: 1.2rem 1.3rem 1.1rem; }
  .tagDialog h2 { margin: 0 0 .2rem; font-size: 1rem; }
  .tagDialog .fuer { margin: 0 0 .8rem; color: #a6adc8; font-size: 12px; }
  .tagDialog .fehler { color: #f38ba8; font-size: 12px; margin: .6rem 0 0; }
  .tagDialog .fehler[hidden] { display: none; }

  .korbnote {
    font-size: 12px; color: #a6adc8; margin: 0 0 1.1rem;
    border-left: 2px solid rgba(255, 255, 255, .12); padding-left: .7rem;
  }
  .hinweis { color: #a6adc8; padding: 2rem 0; text-align: center; }
  .hinweis a { color: #0a84ff; }
  .hinweis p { margin: 0 0 1.1rem; }

  .frage { max-width: 24rem; padding: 1.2rem 1.3rem 1.1rem; }
  .frage h2 { margin: 0 0 .5rem; font-size: 1rem; }
  .frage p { margin: 0; color: #a6adc8; }
  .f-fuss { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.3rem; }

  dialog {
    background: #181825; color: #cdd6f4; border: 1px solid rgba(255, 255, 255, .07);
    border-radius: 12px; padding: 0; max-width: 34rem; width: calc(100% - 2rem);
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }

  button {
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 7px 13px; border: none; border-radius: 6px; cursor: pointer;
    background: #45475a; color: #cdd6f4;
  }
  button:hover { opacity: .85; }
  button.gefahr { background: #4a1f1f; color: #f38ba8; }
  button.wichtig { background: #1a3a2a; color: #a6e3a1; padding: 9px 16px; }
</style>
<link rel="stylesheet" href="modern.css">
</head>
<body>

<header>
  <div class="kopf">
    <a class="home">3D</a>
    <h1 id="libTitel" data-i18n="libHeading">Meine Modelle</h1>
    <span class="zaehler" id="zaehler"></span>
    <span class="sync" id="sync" hidden data-i18n="libSyncing">Wird aktualisiert …</span>
  </div>
  <div class="werkzeuge">
    <label class="suchfeld">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="suche" data-i18n-ph="libSearch" placeholder="Nach Namen suchen …">
      <button type="button" class="suchLeeren" id="suchLeeren" hidden>×</button>
    </label>
    <select id="quelle"><option value="" data-i18n="libAllPlatforms">Alle Plattformen</option></select>
    <select id="sortierung">
      <option value="datum-ab" data-i18n="libSortNewest">Neueste zuerst</option>
      <option value="datum-auf" data-i18n="libSortOldest">Älteste zuerst</option>
      <option value="name-auf" data-i18n="libSortName">Name A–Z</option>
    </select>
    <div class="segment" id="sortSegment" role="group"></div>
    <button id="papierkorb" aria-pressed="false" data-i18n="libTrashButton">Papierkorb</button>
    <button id="korbLeeren" class="gefahr" hidden data-i18n="libTrashEmptyButton">Papierkorb leeren</button>
  </div>
  <div class="tagLeiste" id="tagLeiste" hidden></div>
  <div class="markiertBalken" id="markiert" hidden>
    <span id="markiertText"></span>
    <button id="markiertTags" data-i18n="libTagsEdit">Tags bearbeiten</button>
    <button id="markiertWieder" class="wichtig" hidden></button>
    <button id="markiertWeg" data-i18n="libSelectNone">Markierung aufheben</button>
  </div>
</header>

<main>
  <p class="korbnote" id="korbNote" hidden data-i18n="libTrashNote">Gelöschte Modelle liegen im Ordner _Trash_ in deinem Zielordner, bis du den Papierkorb leerst.</p>
  <div class="hinweis" id="hinweis" data-i18n="libLoading">Ordner wird gelesen …</div>
  <div class="raster" id="raster"></div>
</main>


<!-- Eigene Rueckfrage statt confirm(): Chromes Fenster sagt "The extension
     ... says", sieht aus wie eine Systemwarnung und passt zu nichts hier. -->
<dialog id="frage" class="frage">
  <h2 id="frageTitel"></h2>
  <p id="frageText"></p>
  <div class="f-fuss">
    <button id="frageNein" data-i18n="libCancel">Abbrechen</button>
    <button id="frageJa" class="gefahr"></button>
  </div>
</dialog>

<dialog id="tagDialog" class="tagDialog">
  <h2 data-i18n="libTags">Tags</h2>
  <p class="fuer" id="tagDialogFuer"></p>
  <div id="tagDialogEingabe"></div>
  <div id="tagDialogVorschlaege" hidden></div>
  <p class="fehler" id="tagDialogFehler" hidden></p>
  <div class="f-fuss">
    <button id="tagDialogFertig" class="wichtig" data-i18n="libDone">Fertig</button>
  </div>
</dialog>

<dialog id="tagHilfe" class="hilfe">
  <h2 data-i18n="libTagHelpTitle">So funktionieren Tags</h2>
  <div class="inhalt">
    <h3 data-i18n="libHelpWhatH"></h3>
    <p data-i18n="libHelpWhat"></p>
    <h3 data-i18n="libHelpAssignH"></h3>
    <ul>
      <li data-i18n="libHelpAssignDrag"></li>
      <li data-i18n="libHelpAssignRight"></li>
      <li data-i18n="libHelpAssignPage"></li>
    </ul>
    <h3 data-i18n="libHelpNewH"></h3>
    <p data-i18n="libHelpNew"></p>
    <h3 data-i18n="libHelpManyH"></h3>
    <p data-i18n="libHelpMany"></p>
    <h3 data-i18n="libHelpRemoveH"></h3>
    <p data-i18n="libHelpRemove"></p>
    <h3 data-i18n="libHelpFilterH"></h3>
    <p data-i18n="libHelpFilter"></p>
    <h3 data-i18n="libHelpStoreH"></h3>
    <p data-i18n="libHelpStore"></p>
  </div>
  <div class="f-fuss">
    <button id="tagHilfeZu" class="wichtig" data-i18n="libDone">Fertig</button>
  </div>
</dialog>

<script src="target_dir.js"></script>
<script src="tags.js"></script>
<script src="explorer_link.js"></script>
<script src="library.js"></script>
<script src="home.js"></script>
</body>
</html>
